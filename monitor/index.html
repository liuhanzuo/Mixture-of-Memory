<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU 集群监控</title>
<style>
  :root{
    --bg:#f6f8fa; --card:#ffffff; --line:#e1e6eb; --text:#1f2933; --muted:#7b8794;
    --accent:#3b82f6; --mem:#6366f1; --util:#10b981; --pow:#f59e0b;
    --bad:#ef4444; --ok:#10b981; --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);padding:24px;font-size:13px;line-height:1.5}
  header{display:flex;align-items:baseline;gap:14px;margin-bottom:20px}
  h1{font-size:20px;font-weight:600}
  .sub{color:var(--muted);font-size:12px}
  .pill{margin-left:auto;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .dot.stale{background:var(--bad)}
  .node{background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px}
  .node-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .node-title{font-size:15px;font-weight:600}
  .node-stat{color:var(--muted);font-size:12px}
  .node-badge{font-size:11px;padding:2px 9px;border-radius:20px;background:#eef2f7;color:var(--muted)}
  .node-badge.off{background:#fde8e8;color:var(--bad)}
  .tasks{margin:2px 0 14px;display:flex;flex-direction:column;gap:6px}
  .task{display:flex;align-items:center;gap:10px;font-size:12px;background:#f0f7ff;
    border:1px solid #d6e6fb;border-radius:8px;padding:7px 11px;flex-wrap:wrap}
  .task .tdot{width:7px;height:7px;border-radius:50%;background:var(--util);flex:none}
  .task .tname{font-weight:600;color:#1d4ed8;font-family:ui-monospace,Menlo,Consolas,monospace}
  .task .tmeta{color:var(--muted);font-size:11px;margin-left:auto;white-space:nowrap}
  .task .tpid{color:var(--muted);font-size:11px}
  .metrics{display:flex;gap:6px;flex-wrap:wrap;width:100%;margin-top:4px;padding-top:6px;border-top:1px dashed #d6e6fb}
  .mchip{font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace;background:#fff;
    border:1px solid #dbe7f5;border-radius:6px;padding:2px 7px;color:#334}
  .mchip b{color:#1d4ed8;font-weight:600}
  .mchip.warn b{color:var(--bad)}
  .mprog{font-size:11px;color:var(--muted)}
  .no-task{font-size:12px;color:var(--muted);background:#fafbfc;border:1px dashed var(--line);
    border-radius:8px;padding:7px 11px;margin:2px 0 14px}
  .summary-row{display:flex;gap:24px;margin:6px 0 16px;flex-wrap:wrap}
  .sm{display:flex;flex-direction:column;gap:2px}
  .sm .v{font-size:18px;font-weight:600}
  .sm .k{font-size:11px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .gpu{border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:#fcfdfe}
  .gpu-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .gpu-id{font-weight:600;font-size:13px}
  .gpu-name{font-size:10px;color:var(--muted)}
  .bar-row{margin:6px 0}
  .bar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:2px}
  .bar-label b{color:var(--text);font-weight:600}
  .bar{height:6px;border-radius:4px;background:#eef2f7;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:4px;transition:width .4s ease}
  .charts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
  .chart{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fcfdfe}
  .chart h4{font-size:11px;color:var(--muted);font-weight:500;margin-bottom:6px;display:flex;justify-content:space-between}
  .chart h4 b{font-weight:600}
  svg{display:block;width:100%;height:54px}
  @media(max-width:720px){.charts{grid-template-columns:1fr}}
  .metric-chart-wrap{width:100%;margin-top:8px;background:#fbfdff;border:1px solid #dbe7f5;border-radius:8px;padding:8px 10px}
  .metric-chart-title{font-size:11px;color:#7b8794;font-weight:500;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .metric-chart-title span{font-weight:600;color:#1f2933}
  .mc-lines{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
  .mc-line{background:#fff;border:1px solid #e1e6eb;border-radius:7px;padding:6px 8px}
  .mc-line-label{font-size:10px;color:#7b8794;margin-bottom:3px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .mc-line-label b{color:#1f2933;font-weight:600;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
  .mc-svg{display:block;width:100%;height:42px}
  @media(max-width:980px){.mc-lines{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:720px){.mc-lines{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>GPU 集群监控</h1>
  <span class="sub">本机 · .196 · B200 — 实时显存 / 利用率 / 功耗 + 历史波动</span>
  <span class="pill"><span class="dot" id="livedot"></span><span id="updated">连接中…</span></span>
</header>
<div id="app"></div>

<script>
const COL={mem:'#6366f1',util:'#10b981',pow:'#f59e0b'};
const MCOL={lm:'#3b82f6',t2_needle:'#8b5cf6',distill_kl:'#ec4899',distill_hid:'#14b8a6'};
const METRIC_CURVES=[
  ['lm','lm',MCOL.lm],
  ['t2_needle','t2_needle',MCOL.t2_needle],
  ['distill_kl','distill_kl',MCOL.distill_kl],
  ['distill_hid','distill_hid',MCOL.distill_hid],
];
function fmtMem(mb){return (mb/1024).toFixed(1)+' GB';}
function spark(pts, color, max){
  if(!pts.length) return '<svg></svg>';
  const W=100,H=54,pad=2;
  const n=pts.length;
  const mx = max || Math.max(...pts,1);
  const step = n>1 ? (W-pad*2)/(n-1) : 0;
  let d='';
  pts.forEach((v,i)=>{
    const x=pad+i*step, y=H-pad-(v/mx)*(H-pad*2);
    d+=(i?'L':'M')+x.toFixed(1)+','+y.toFixed(1)+' ';
  });
  const area=d+`L${(pad+(n-1)*step).toFixed(1)},${H-pad} L${pad},${H-pad} Z`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${area}" fill="${color}" opacity="0.10"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.4"/></svg>`;
}

// Render a single metric line chart using pure SVG (no external libs).
// X-axis is true training step, not equal point spacing.
function metricLineChart(pts, key, label, color){
  const W=200, H=42, px=6, py=4;
  const pairs = pts
    .filter(p=>p.step!=null && p[key]!=null && isFinite(p.step) && isFinite(p[key]))
    .map(p=>({step:Number(p.step), val:Number(p[key])}));
  if(!pairs.length) return '';
  const vals = pairs.map(p=>p.val);
  const steps = pairs.map(p=>p.step);
  const minV=Math.min(...vals), maxV=Math.max(...vals), rangeV=maxV-minV || 1;
  const minS=Math.min(...steps), maxS=Math.max(...steps), rangeS=maxS-minS || 1;
  let d='';
  pairs.forEach((p,i)=>{
    const x=px+((p.step-minS)/rangeS)*(W-px*2);
    const y=py+(H-py*2)*(1-(p.val-minV)/rangeV);
    d+=(i?'L':'M')+x.toFixed(1)+','+y.toFixed(1)+' ';
  });
  const last = pairs[pairs.length-1];
  const lastStr = Number.isInteger(last.val) ? String(last.val) : last.val.toFixed(4);
  const lastX=px+((last.step-minS)/rangeS)*(W-px*2);
  const lastY=py+(H-py*2)*(1-(last.val-minV)/rangeV);
  const area=d+`L${lastX.toFixed(1)},${H-py} L${px},${H-py} Z`;
  return `<div class="mc-line">
    <div class="mc-line-label"><span>${label}</span><b>${lastStr}</b></div>
    <svg class="mc-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <path d="${area}" fill="${color}" opacity="0.10"/>
      <path d="${d}" fill="none" stroke="${color}" stroke-width="1.5"/>
      <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="2" fill="${color}" opacity="0.85"/>
      <text x="${px}" y="${H-1}" font-size="8" fill="#aab" text-anchor="start">${minS}</text>
      <text x="${W-px}" y="${H-1}" font-size="8" fill="#aab" text-anchor="end">${maxS}</text>
    </svg>
  </div>`;
}

function metricHistoryKey(taskName, metricHistory){
  const base = (taskName||'').split('/').pop();
  return Object.keys(metricHistory).find(k=>
    taskName.includes(k) || k.includes(taskName) || base.includes(k) || k.includes(base)
  );
}

// Build recent metric history chart block for a task card.
function metricHistoryBlock(taskName, metricHistory){
  const key = metricHistoryKey(taskName, metricHistory);
  if(!key) return '';
  const pts = (metricHistory[key]||[]).slice(-160);
  const charts = METRIC_CURVES
    .map(([metric,label,color])=>metricLineChart(pts,metric,label,color))
    .filter(Boolean).join('');
  if(!charts) return '';
  const latestStep = pts[pts.length-1] && pts[pts.length-1].step;
  return `<div class="metric-chart-wrap">
    <div class="metric-chart-title"><span>${key}</span> metric history <span style="font-weight:400;color:#7b8794">step ${latestStep} · recent ${pts.length}</span></div>
    <div class="mc-lines">${charts}</div>
  </div>`;
}
function barColor(pct){return pct>90?'#ef4444':pct>70?'#f59e0b':'#10b981';}

async function tick(){
  let data;
  try{ data = await (await fetch('/api/data')).json(); }
  catch(e){ document.getElementById('updated').textContent='后端断开'; 
    document.getElementById('livedot').classList.add('stale'); return; }
  const now = data.server_time;
  document.getElementById('updated').textContent='更新于 '+new Date().toLocaleTimeString();
  document.getElementById('livedot').classList.remove('stale');

  let html='';
  for(const node of data.nodes){
    const L = data.latest[node.id]||{};
    const hist = data.history[node.id]||[];
    const ok = L.ok && (now - (L.t||0) < 30);
    const gpus = (L.gpus||[]);
    const totUsed = gpus.reduce((a,g)=>a+g.mem_used,0);
    const totMem = gpus.reduce((a,g)=>a+g.mem_total,0);
    const avgUtil = gpus.length? gpus.reduce((a,g)=>a+g.util,0)/gpus.length:0;
    const totPow = gpus.reduce((a,g)=>a+g.power,0);
    const totPowLim = gpus.reduce((a,g)=>a+g.power_limit,0);

    let gpuCards='';
    for(const g of gpus){
      const memPct = g.mem_total? g.mem_used/g.mem_total*100:0;
      const powPct = g.power_limit? g.power/g.power_limit*100:0;
      gpuCards+=`<div class="gpu">
        <div class="gpu-top"><span class="gpu-id">GPU ${g.index}</span><span class="gpu-name">${g.name}</span></div>
        <div class="bar-row"><div class="bar-label"><span>显存</span><b>${fmtMem(g.mem_used)} / ${fmtMem(g.mem_total)}</b></div>
          <div class="bar"><i style="width:${memPct.toFixed(1)}%;background:${barColor(memPct)}"></i></div></div>
        <div class="bar-row"><div class="bar-label"><span>利用率</span><b>${g.util.toFixed(0)}%</b></div>
          <div class="bar"><i style="width:${g.util.toFixed(1)}%;background:${COL.util}"></i></div></div>
        <div class="bar-row"><div class="bar-label"><span>功耗</span><b>${g.power.toFixed(0)} / ${g.power_limit.toFixed(0)} W</b></div>
          <div class="bar"><i style="width:${powPct.toFixed(1)}%;background:${COL.pow}"></i></div></div>
      </div>`;
    }

    const memHist = hist.map(h=>h.mem_used);
    const utilHist = hist.map(h=>h.util);
    const powHist = hist.map(h=>h.power);
    const charts = ok && hist.length ? `<div class="charts">
      <div class="chart"><h4><span>显存历史</span><b>${fmtMem(totUsed)}</b></h4>${spark(memHist,COL.mem,totMem)}</div>
      <div class="chart"><h4><span>利用率历史</span><b>${avgUtil.toFixed(0)}%</b></h4>${spark(utilHist,COL.util,100)}</div>
      <div class="chart"><h4><span>功耗历史</span><b>${totPow.toFixed(0)} W</b></h4>${spark(powHist,COL.pow,totPowLim||1)}</div>
    </div>`:'';

    const tlist = (data.tasks && data.tasks[node.id]) || [];
    const mlist = (data.metrics && data.metrics[node.id]) || [];
    // match metrics to a task by run-name substring (run names ≈ output_dir/log names)
    function metricFor(taskName){
      return mlist.find(m => m.run && (taskName.includes(m.run) || m.run.includes(taskName)))
             || null;
    }
    // metric keys to show as chips (skip step/total — shown as progress)
    const MK = [['lm','lm'],['t2_needle','t2_needle'],['distill_kl','distill_kl'],
                ['distill_hid','distill_hid'],['aux','aux'],['lr','lr'],
                ['nf','nf'],['speed','sp/s']];
    function metricChips(m){
      if(!m) return '';
      let chips='';
      if(m.step!=null){
        const tot = m.total_steps!=null? '/'+m.total_steps : '';
        chips+=`<span class="mchip"><b>step</b> ${m.step}${tot}</span>`;
      }
      for(const [k,lab] of MK){
        if(m[k]==null) continue;
        let v=m[k];
        if(typeof v==='number') v = (k==='lr')? v.toExponential(2)
           : (Number.isInteger(v)? v : v.toFixed(4));
        const warn=(k==='nf'&&m[k]>0)?' warn':'';
        chips+=`<span class="mchip${warn}"><b>${lab}</b> ${v}</span>`;
      }
      return chips? `<div class="metrics">${chips}</div>`:'';
    }
    let tasksHtml='';
    if(ok){
      if(tlist.length){
        tasksHtml='<div class="tasks">'+tlist.map(t=>{
          const m=metricFor(t.name);
          const mhChart = metricHistoryBlock(t.name, data.metric_history||{});
          return `<div class="task">
            <span class="tdot"></span>
            <span class="tname">${t.name}</span>
            <span class="tpid">PID ${t.pid}</span>
            <span class="tmeta">已运行 ${t.elapsed}</span>
            ${metricChips(m)}
            ${mhChart}
          </div>`;
        }).join('')+'</div>';
      } else {
        tasksHtml='<div class="no-task">空闲 — 当前无训练任务</div>';
      }
    }

    html+=`<div class="node">
      <div class="node-head">
        <span class="node-title">${node.label}</span>
        <span class="node-badge ${ok?'':'off'}">${ok?(gpus.length+' GPU 在线'):'离线/无响应'}</span>
      </div>
      ${ok?`${tasksHtml}<div class="summary-row">
        <div class="sm"><span class="v">${fmtMem(totUsed)}</span><span class="k">总显存占用 / ${fmtMem(totMem)}</span></div>
        <div class="sm"><span class="v">${avgUtil.toFixed(0)}%</span><span class="k">平均利用率</span></div>
        <div class="sm"><span class="v">${totPow.toFixed(0)} W</span><span class="k">总功耗 / ${totPowLim.toFixed(0)} W</span></div>
      </div>
      <div class="grid">${gpuCards}</div>
      ${charts}`:'<div class="node-stat">该节点暂时无法采集（离线 / SSH 拒绝 / nvidia-smi 失败）</div>'}
    </div>`;
  }
  document.getElementById('app').innerHTML=html;
}
tick(); setInterval(tick, 5000);
</script>
</body>
</html>
