[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scaffold-coder"
version = "0.0.1"
description = "Typed-tree runtime for hierarchical diffusion code generation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["scaffold_coder*"]

[tool.setuptools.package-data]
scaffold_coder = ["training/config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
